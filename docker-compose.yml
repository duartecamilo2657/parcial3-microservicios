  # ============================
  create_mascotas:
    build: ./services/mascotas/create
    container_name: create_mascotas_service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CREATE_PORT: ${CREATE_PORT_MASCOTAS}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${CREATE_PORT_MASCOTAS}:${CREATE_PORT_MASCOTAS}"

  read_mascotas:
    build: ./services/mascotas/read
    container_name: read_mascotas_service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      READ_PORT: ${READ_PORT_MASCOTAS}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${READ_PORT_MASCOTAS}:${READ_PORT_MASCOTAS}"

  update_mascotas:
    build: ./services/mascotas/update   
    container_name: update_mascotas_service
    depends_on:
      mongo:
        condition: service_healthy  
    environment:
      UPDATE_PORT: ${UPDATE_PORT_MASCOTAS}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${UPDATE_PORT_MASCOTAS}:${UPDATE_PORT_MASCOTAS}"

  delete_mascotas:
    build: ./services/mascotas/delete
    container_name: delete_mascotas_service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DELETE_PORT: ${DELETE_PORT_MASCOTAS}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${DELETE_PORT_MASCOTAS}:${DELETE_PORT_MASCOTAS}"
    
   
volumes:
  mongo_data:
